plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.csaben.openone'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.csaben.openone'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // clark-expo (or your own apksigner) signs the APK afterwards; for a plain
            // `./gradlew assembleRelease`, it's signed with the debug key so it installs.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
